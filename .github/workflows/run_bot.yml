name: Run Discord Bot at 9 AM IST

on:
  schedule:
    # Yeh automatic subah 9:00 AM IST (3:30 AM UTC) ko trigger karega
    - cron: '30 3 * * *'
  
  # Yeh line add karne se tumhein dashboard par manual "Run workflow" ka button mil jayega
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Execute Python Script
      run: python discord_chat.py
